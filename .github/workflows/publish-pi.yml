name: Publish Pi Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'marketplace.json'

concurrency:
  group: publish-pi
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate canonical sources
        run: pnpm validate

      - name: Typecheck, lint, and test
        run: pnpm check

      - name: Verify Pi install and update against a local remote
        run: |
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          PI_TEST_BINARY="$(command -v pi)" pnpm test:pi-publication

      - name: Build and publish Pi projection
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          pnpm publish-pi
